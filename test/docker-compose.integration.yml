# 集成测试编排:真实 MySQL 8.4.9(对齐生产库版本)+ 真实 new-api rc.4 + 容器内跑 e2e(里程碑 1/2/3a/3b)。
# 关键(放行前实测结论):8.4 默认账号 caching_sha2_password;平台 go-sql-driver v1.8.1 整包无
# AllowPublicKeyRetrieval,非 TLS 下取不到公钥连不上 → 必须走 TLS。**caching_sha2 over TLS 不需公钥**
# (密码经 TLS 加密发送),DSN 带 tls=skip-verify 即可(mysql 镜像初始化自带自签证书)。生产 NEXUS_DB_DSN
# 同此口径(enterprise.env.example 已用 tls=skip-verify)。这就是把测试从 8.0 抬到 8.4.9 要验的核心:
# 平台在 8.4 caching_sha2 + TLS 下连库正常。
# new-api 也连 MySQL(独立 newapi 库),使测试能向 newapi.logs 造 type=2 消费日志验扣费(3b)。
# 全程容器内,不碰本机 Go。用法:
#   docker compose -f test/docker-compose.integration.yml up --build \
#       --abort-on-container-exit --exit-code-from tests
services:
  mysql:
    image: mysql:8.4.9   # 默认 caching_sha2 + 初始化自带自签证书(支持 TLS),对齐生产
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: newapi          # new-api 启动即需此库;平台库 nexus 由测试自建
    tmpfs:
      - /var/lib/mysql                # 一次性:测试库不落盘
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
      interval: 3s
      timeout: 5s
      retries: 30

  newapi:
    image: calciumion/new-api:v1.0.0-rc.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SQL_DSN: "root:rootpw@tcp(mysql:3306)/newapi?tls=skip-verify"  # caching_sha2 over TLS(8.4 默认账号)
      # 抬高全局 API/Web 限流,避免集成 e2e 高频调用触发 429(测试环境专用)。
      # 关键:NUM 与 DURATION 都要给——只给 NUM 不生效(实测 rc.4 需配套 DURATION)。
      GLOBAL_API_RATE_LIMIT: "100000"
      GLOBAL_API_RATE_LIMIT_DURATION: "60"
      GLOBAL_WEB_RATE_LIMIT: "100000"
      GLOBAL_WEB_RATE_LIMIT_DURATION: "60"
    tmpfs:
      - /data
    expose:
      - "3000"

  tests:
    build:
      context: ..
      dockerfile: Dockerfile.test
    depends_on:
      mysql:
        condition: service_healthy
      newapi:
        condition: service_started
    environment:
      NEXUS_IT_DSN: "root:rootpw@tcp(mysql:3306)/nexus?parseTime=true&loc=UTC&charset=utf8mb4&tls=skip-verify"
      NEXUS_IT_NEWAPI_URL: "http://newapi:3000"
      # new-api 的库连接:测试用它建 nexus 库 + 向 newapi.logs 造 type=2 消费日志(验扣费)。
      NEXUS_IT_NEWAPI_SQL_DSN: "root:rootpw@tcp(mysql:3306)/newapi?parseTime=true&loc=UTC&charset=utf8mb4&tls=skip-verify"
    command: ["go", "test", "./test/integration/", "-run", "Integration", "-v", "-count=1", "-timeout", "300s"]
