name: CI

# 沿用 Git 协作与发版规范:
#   - push dev / 向 main|dev 提 PR → 跑 vet + 单测(mock)+ 真机契约(rc.4 服务容器)
#   - push dev → 构建并推 :dev 测试镜像到 GHCR
#   - 打 v* tag → 构建并推正式镜像到 GHCR
on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      newapi:
        image: calciumion/new-api:v1.0.0-rc.4
        # 抬高全局 API/Web 限流,避免 e2e 高频调用触发 429(rc.4 需 NUM+DURATION 配套才生效)。
        env:
          GLOBAL_API_RATE_LIMIT: "100000"
          GLOBAL_API_RATE_LIMIT_DURATION: "60"
          GLOBAL_WEB_RATE_LIMIT: "100000"
          GLOBAL_WEB_RATE_LIMIT_DURATION: "60"
        ports:
          - "3000:3000"
    # 注:集成测试(含扣费/对账段)改用 test/docker-compose.integration.yml 自包含栈跑(见下方步骤),
    # 其内置独立 MySQL(newapi 库)+ depends_on 顺序 + NEXUS_IT_NEWAPI_SQL_DSN,故此处不再起 GHA mysql 服务。
    # newapi GHA 服务仅供"真机契约测试"用(SQLite,无需 MySQL)。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: vet
        run: go vet ./...
      - name: 单元/契约(mock-rc.4)
        run: go test -race ./...
      - name: 等待 new-api 就绪
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/status >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "new-api 未就绪" >&2; exit 1
      - name: 真机契约测试(对 rc.4)
        env:
          NEWAPI_CONTRACT_BASE_URL: http://localhost:3000
          NEWAPI_CONTRACT_AUTO_SETUP: "1"
        run: go test ./adapter/newapi/ -run Contract -v
      - name: 集成测试 e2e(MySQL + rc.4 + 扣费/去重/守恒/对账段,自包含集成 compose)
        # 改用 test/docker-compose.integration.yml:newapi 连独立 MySQL(newapi 库),测试容器内置
        # NEXUS_IT_NEWAPI_SQL_DSN → 向 newapi.logs 造 type=2 消费日志,**真跑结算扣费/去重/守恒/对账**
        # (GZ-01 涉钱回归保护;此前 GHA newapi 用 SQLite 致扣费段被 if newapiSQLDSN=="" 整段跳过)。
        # compose 自带 depends_on(mysql healthy)解决启动顺序,tmpfs 一次性不落盘,本地已验证全通过。
        run: docker compose -f test/docker-compose.integration.yml up --build --abort-on-container-exit --exit-code-from tests

  image:
    needs: test
    # dev 分支或 v* tag 才构建镜像。
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 计算镜像 tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/yl0711-coder/nexusapi-enterprise:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
