<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企业管理台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<style>
/* 生产前端补充:登录表单与少量布局,沿用原型设计变量 */
.loginbox .fld input{margin:0}
.kvtable td{padding:7px 0;border-bottom:1px solid var(--line)}.kvtable td.k{color:var(--muted);width:42%}
.errline{color:var(--bad);font-size:12.5px;margin-top:8px;min-height:16px}
.badge-dot{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 4px;margin-left:6px}
</style>
</head>
<body>
<!-- 登录覆盖层 -->
<div class="login" id="login">
  <div class="loginbox">
    <div class="lg"><span class="mk" style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800">N</span> <span id="lg_prod">企业管理台</span></div>
    <div class="mini" style="margin:6px 0 20px">AI 用量管理</div>
    <div class="fld"><label for="lg_email">账号(邮箱)</label><input id="lg_email" placeholder="you@company.com" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('lg_pw').focus()"></div>
    <div class="fld"><label for="lg_pw">密码</label><input id="lg_pw" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn pri" style="width:100%;padding:11px" id="lg_btn" onclick="doLogin()">登录</button>
    <div class="errline" id="lg_err"></div>
    <div class="mini" style="margin-top:6px;color:#8a93a7">忘记密码?请联系你的管理员重置</div>
  </div>
</div>

<!-- 主应用 -->
<div id="app"></div>

<!-- 模态 + toast -->
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
