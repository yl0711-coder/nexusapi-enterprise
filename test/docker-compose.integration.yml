# 里程碑 1 集成测试编排:真实 MySQL 8.0 + 真实 new-api rc.4 + 容器内跑 e2e。
# 全程容器内编译/运行,不碰本机 Go。用法:
#   docker compose -f test/docker-compose.integration.yml up --build \
#       --abort-on-container-exit --exit-code-from tests
services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: nexus
    tmpfs:
      - /var/lib/mysql   # 一次性:测试库不落盘
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw"]
      interval: 3s
      timeout: 5s
      retries: 30

  newapi:
    image: calciumion/new-api:v1.0.0-rc.4
    tmpfs:
      - /data            # 一次性:不持久化
    expose:
      - "3000"

  tests:
    build:
      context: ..
      dockerfile: Dockerfile.test
    depends_on:
      mysql:
        condition: service_healthy
      newapi:
        condition: service_started
    environment:
      NEXUS_IT_DSN: "root:rootpw@tcp(mysql:3306)/nexus?parseTime=true&loc=UTC&charset=utf8mb4"
      NEXUS_IT_NEWAPI_URL: "http://newapi:3000"
    command: ["go", "test", "./test/integration/", "-run", "Integration", "-v", "-count=1", "-timeout", "240s"]
